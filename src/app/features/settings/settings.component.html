<div class="container mt-4" data-bs-theme="dark">
  <!-- Encabezado -->
  <div class="mb-3">
    <h2 class="fw-bold mb-1">Configuración</h2>
    <p class="text-secondary small mb-0">Valores únicos para todo el sistema.</p>
  </div>

  <!-- Pestañas -->
  <ul class="nav nav-tabs border-secondary mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" role="tab" [class.active]="activeTab() === 'export'" (click)="setTab('export')">
        <i class="bi bi-cloud-arrow-up me-1"></i> Exportación a Odoo
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" role="tab" [class.active]="activeTab() === 'labels'" (click)="setTab('labels')">
        <i class="bi bi-upc-scan me-1"></i> Etiquetas
      </button>
    </li>
  </ul>

  @if (activeTab() === 'export') {
    <app-export-settings></app-export-settings>
  } @else {
    <app-label-settings></app-label-settings>
  }
</div>
