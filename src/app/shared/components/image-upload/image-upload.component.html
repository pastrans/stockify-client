<div ngbDropdown container="body" placement="bottom-start bottom-end top-start" class="image-upload" [class.image-upload-sm]="size === 'sm'">
  <!-- Al pulsar la imagen se elige qué hacer: ver, subir archivo o tomar fotografía -->
  <button
    type="button"
    class="image-box rounded border bg-black bg-opacity-25 d-flex align-items-center justify-content-center text-secondary p-0"
    [class.border-secondary]="state() !== 'failed' && state() !== 'ready' && state() !== 'removed'"
    [class.border-danger]="state() === 'failed'"
    [class.border-success]="state() === 'ready'"
    [class.border-warning]="state() === 'removed'"
    [disabled]="disabled && !canPreview"
    [title]="errorMessage() ?? label"
    [attr.aria-label]="label + ': opciones de imagen'"
    ngbDropdownToggle
  >
    @if (displayUrl; as url) {
      <img [src]="url" [alt]="label" class="w-100 h-100 rounded object-fit-cover" [class.opacity-50]="isBusy || state() === 'failed'">
    } @else {
      <span class="text-center">
        <i class="bi bi-camera" [class.fs-3]="size === 'lg'"></i>
        @if (size === 'lg') {
          <span class="d-block small mt-1">{{ label }}</span>
        }
      </span>
    }

    <!-- Estados superpuestos -->
    @if (isBusy) {
      <span class="image-overlay">
        <span class="spinner-border spinner-border-sm text-light" role="status"></span>
        @if (size === 'lg') {
          <span class="small mt-1">{{ state() === 'uploading' ? 'Subiendo...' : 'Procesando...' }}</span>
        }
      </span>
    } @else if (state() === 'failed') {
      <span class="image-overlay text-danger">
        <i class="bi bi-exclamation-triangle-fill" [class.fs-4]="size === 'lg'"></i>
      </span>
    }
  </button>

  <div ngbDropdownMenu class="dropdown-menu-dark">
    @if (canPreview) {
      <button type="button" ngbDropdownItem (click)="openPreview()">
        <i class="bi bi-zoom-in me-2 text-info"></i> Ver imagen
      </button>
    }
    @if (!disabled) {
      <button type="button" ngbDropdownItem (click)="chooseFile()">
        <i class="bi bi-upload me-2"></i> Subir archivo
      </button>
      <button type="button" ngbDropdownItem (click)="takePhoto()">
        <i class="bi bi-camera-fill me-2"></i> Tomar fotografía
      </button>
      @if (canUndo || canRemove) {
        <div class="dropdown-divider"></div>
      }
      @if (canUndo) {
        <button type="button" ngbDropdownItem (click)="undo()">
          <i class="bi bi-arrow-counterclockwise me-2 text-warning"></i> Descartar cambio
        </button>
      }
      @if (canRemove) {
        <button type="button" ngbDropdownItem class="text-danger" (click)="remove()">
          <i class="bi bi-trash-fill me-2"></i> Quitar imagen
        </button>
      }
    }
  </div>

  <input #fileInput type="file" class="d-none" [accept]="accept" (change)="onFileSelected($event)">
  <!-- Cámara del sistema (móvil) cuando el navegador no permite la cámara en vivo -->
  <input #captureInput type="file" class="d-none" accept="image/*" capture="environment" (change)="onFileSelected($event)">
</div>

@if (size === 'lg') {
  @if (errorMessage()) {
    <div class="text-danger small mt-1 image-message">{{ errorMessage() }}</div>
  } @else if (state() === 'ready') {
    <div class="text-success small mt-1 image-message"><i class="bi bi-check-circle me-1"></i>Lista para guardar</div>
  } @else if (state() === 'removed') {
    <div class="text-warning small mt-1 image-message">Se quitará al guardar</div>
  }
}
