<div ngbDropdown container="body" placement="bottom-start bottom-end top-start" (openChange)="onOpenChange($event)">
  <button
    type="button"
    class="form-select select-toggle text-start"
    [class.form-select-sm]="size === 'sm'"
    [class.is-invalid]="invalid"
    [id]="inputId"
    [disabled]="disabled"
    ngbDropdownToggle
  >
    @if (selected; as option) {
      <span class="d-inline-flex align-items-center gap-1 text-truncate">
        @if (option.colorHex) {
          <span class="color-dot" [style.background-color]="option.colorHex"></span>
        }
        {{ option.label }}
        @if (option.hint) {
          <span class="font-monospace text-secondary small">{{ option.hint }}</span>
        }
      </span>
    } @else {
      <span class="text-secondary">{{ placeholder }}</span>
    }
  </button>

  <div ngbDropdownMenu class="dropdown-menu-dark select-menu p-0" [style.width.px]="menuWidth">
    <div class="p-2 border-bottom border-secondary">
      <input
        #searchInput
        type="search"
        class="form-control form-control-sm"
        [placeholder]="searchPlaceholder"
        [value]="term"
        (input)="onSearch($event)"
        (keydown.enter)="selectFirst($event)"
      >
    </div>
    @if (loading) {
      <div class="dropdown-item-text small text-secondary d-flex align-items-center gap-2 border-bottom border-secondary">
        <span class="spinner-border spinner-border-sm" role="status"></span> Actualizando...
      </div>
    }
    <div class="select-options py-1">
      @for (option of filtered; track option.value) {
        <button
          type="button"
          ngbDropdownItem
          class="d-flex align-items-center gap-2"
          [class.active]="option.value === value"
          [disabled]="!!option.disabled"
          [title]="option.disabledReason ?? ''"
          (click)="select(option)"
        >
          @if (option.colorHex) {
            <span class="color-dot" [style.background-color]="option.colorHex"></span>
          }
          <span class="text-truncate">{{ option.label }}</span>
          @if (option.hint) {
            <span class="font-monospace small opacity-75">{{ option.hint }}</span>
          }
          @if (option.value === value) {
            <i class="bi bi-check-lg ms-auto"></i>
          }
        </button>
      } @empty {
        <span class="dropdown-item-text small text-secondary">{{ emptyText }}</span>
      }
    </div>
  </div>
</div>
