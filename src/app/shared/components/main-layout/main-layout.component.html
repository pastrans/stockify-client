<div class="main-layout-wrapper">
  <!-- Navbar Superior Horizontal -->
  <header class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3 px-lg-4">
    <div class="container-fluid">
      <!-- Marca -->
      <a class="navbar-brand d-flex align-items-center fw-bold me-4" routerLink="/">
        <i class="bi bi-boxes fs-4 text-primary me-2"></i>
        <span>Stockify <span class="text-primary">POS</span></span>
      </a>

      <!-- Menú Móvil -->
      <button
        class="navbar-toggler"
        type="button"
        (click)="isMenuCollapsed = !isMenuCollapsed"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces Horizontales -->
      <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item">
            <a routerLink="/products" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-box-seam me-2"></i> Catálogo & Productos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/attributes" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-palette me-2"></i> Atributos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/pos-categories" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-grid me-2"></i> Categorías POS
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/users" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-people me-2"></i> Usuarios
            </a>
          </li>
          <!-- Etiquetas: cola de impresión, plantillas, configuración y guías -->
          <li class="nav-item" ngbDropdown routerLinkActive #labelsMenu="routerLinkActive">
            <button
              type="button"
              class="nav-link px-3 d-flex align-items-center"
              [class.active]="labelsMenu.isActive"
              ngbDropdownToggle
            >
              <i class="bi bi-upc-scan me-2"></i> Etiquetas
              @if (queuedLabels() > 0) {
                <span class="badge rounded-pill bg-info text-dark ms-2" [title]="queuedLabels() + ' etiquetas en la cola'">{{ queuedLabels() }}</span>
              }
            </button>
            <div ngbDropdownMenu>
              <a ngbDropdownItem routerLink="/labels/queue" routerLinkActive="active" class="d-flex align-items-center" (click)="isMenuCollapsed = true">
                <i class="bi bi-inbox me-2"></i> Cola de impresión
                @if (queuedLabels() > 0) {
                  <span class="badge rounded-pill bg-info text-dark ms-auto ps-2">{{ queuedLabels() }}</span>
                }
              </a>
              <a ngbDropdownItem routerLink="/labels/templates" routerLinkActive="active" (click)="isMenuCollapsed = true">
                <i class="bi bi-file-earmark-code me-2"></i> Plantillas
              </a>
              <a
                ngbDropdownItem
                routerLink="/settings"
                [queryParams]="{ tab: 'labels' }"
                routerLinkActive="active"
                (click)="isMenuCollapsed = true"
              >
                <i class="bi bi-sliders me-2"></i> Configuración
              </a>
              <div class="dropdown-divider"></div>
              <a ngbDropdownItem routerLink="/labels/guide" routerLinkActive="active" (click)="isMenuCollapsed = true">
                <i class="bi bi-journal-text me-2"></i> Guías
              </a>
            </div>
          </li>
          <!-- Exportación a Odoo: el toggle se marca activo si lo está alguna de sus entradas.
               Con queryParams exactos, /settings?tab=labels activa "Etiquetas" y no este menú -->
          <li class="nav-item" ngbDropdown routerLinkActive #odooMenu="routerLinkActive" [routerLinkActiveOptions]="exactQueryParams">
            <button
              type="button"
              class="nav-link px-3 d-flex align-items-center"
              [class.active]="odooMenu.isActive"
              ngbDropdownToggle
            >
              <i class="bi bi-cloud-arrow-up me-2"></i> Odoo
            </button>
            <div ngbDropdownMenu>
              <a ngbDropdownItem routerLink="/settings" routerLinkActive="active" [routerLinkActiveOptions]="exactQueryParams" (click)="isMenuCollapsed = true">
                <i class="bi bi-gear me-2"></i> Configuración de exportación
              </a>
              <a ngbDropdownItem routerLink="/odoo-guide" routerLinkActive="active" (click)="isMenuCollapsed = true">
                <i class="bi bi-journal-text me-2"></i> Guía de importación
              </a>
            </div>
          </li>
        </ul>

        <!-- Botón Cerrar Sesión -->
        <div class="d-flex align-items-center pt-2 pt-lg-0">
          <button class="btn btn-outline-danger btn-sm d-flex align-items-center" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido de la Pantalla -->
  <main class="container-fluid py-4 px-3 px-lg-4">
    <router-outlet></router-outlet>
  </main>
</div>
