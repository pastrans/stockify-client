<div class="main-layout-wrapper">
  <!-- Navbar Superior Horizontal -->
  <header class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3 px-lg-4">
    <div class="container-fluid">
      <!-- Marca -->
      <a class="navbar-brand d-flex align-items-center fw-bold me-4" routerLink="/">
        <i class="bi bi-boxes fs-4 text-primary me-2"></i>
        <span>Stockify <span class="text-primary">POS</span></span>
      </a>

      <!-- Menú Móvil -->
      <button
        class="navbar-toggler"
        type="button"
        (click)="isMenuCollapsed = !isMenuCollapsed"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces Horizontales -->
      <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item">
            <a routerLink="/products" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-box-seam me-2"></i> Catálogo & Productos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/attributes" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-palette me-2"></i> Atributos
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/pos-categories" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-grid me-2"></i> Categorías POS
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/inventory" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-clipboard-check me-2"></i> Conteo Físico
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/users" routerLinkActive="active" class="nav-link px-3 d-flex align-items-center">
              <i class="bi bi-people me-2"></i> Usuarios
            </a>
          </li>
        </ul>

        <!-- Botón Cerrar Sesión -->
        <div class="d-flex align-items-center pt-2 pt-lg-0">
          <button class="btn btn-outline-danger btn-sm d-flex align-items-center" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>
            Cerrar Sesión
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido de la Pantalla -->
  <main class="container-fluid py-4 px-3 px-lg-4">
    <router-outlet></router-outlet>
  </main>
</div>
